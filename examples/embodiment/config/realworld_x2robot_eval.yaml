defaults:
  - env/realworld_x2robot@env.train
  - env/realworld_x2robot@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    actor:
      node_group: "4090"
      placement: 0
    env:
      node_group: turtle2
      placement: 0
    rollout:
      node_group: "4090"
      placement: 0
  node_groups:
    - label: "4090"
      node_ranks: 0
    - label: turtle2
      node_ranks: 1
      hardware:
        type: Turtle2
        configs:
          - node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "realworld-x2robot-eval"
    logger_backends: ["tensorboard"]

  only_eval: True
  val_check_interval: -1

  ckpt_path: "/path/to/x2robot_ckpt.pt"

algorithm:
  group_size: 1
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: "token-mean"

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: 14
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 1

  eval:
    ignore_terminations: False
    total_num_envs: 1
    max_steps_per_rollout_epoch: 200
    max_episode_steps: 200

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: False

  model:
    model_path: "/path/to/x2robot_model"
    precision: ${actor.model.precision}

critic:
  use_critic_model: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 64
  global_batch_size: 256
  seed: 1234
  enable_offload: True

  model:
    model_path: ${rollout.model.model_path}
    num_action_chunks: 10   # chunk length T; match the converted ckpt
    state_dim: 14           # dual-arm xyz_rpy_gripper (7 x 2)
    action_dim: 14
    add_value_head: False

    openpi:
      config_name: "pi0_x2robot"
      num_images_in_input: 3
      action_chunk: ${actor.model.num_action_chunks}
