defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1
    rollout: 0
    env: 1

runner:
  task_type: embodied
  logger:
    log_path: logs/realagainst_peg_slot_dagger
    project_name: rlinf
    experiment_name: realagainst_peg_slot_dagger
    logger_backends: [tensorboard]
  max_epochs: 10000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 100
  resume_dir: null
  ckpt_path: null

algorithm:
  dagger:
    only_save_expert: true
    online_lerobot:
      enabled: true
      only_success: false
      robot_type: panda
      fps: 20
      finalize_interval: 16
      max_episodes: 500
      collection_schedule:
        enabled: true
        initial_episodes: 16
        end_fraction: 0.5
      data_path: ${oc.env:REPO_PATH}/data/realagainst_peg_slot_dagger
      rolling_lerobot_window_size: 50000
      min_frames: 1
      lerobot_num_workers: 0
  update_epoch: 1
  adv_type: gae
  loss_type: embodied_dagger

env:
  group_name: EnvGroup
  train:
    env_type: maniskill
    total_num_envs: 16
    rollout_epoch: 1
    reset_seed_mode: sequential
    wrap_obs_mode: raw
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: false
    reward_mode: raw
    seed: 0
    group_size: 1
    use_fixed_reset_state_ids: false
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    expert_intervention_beta: 0.5
    enable_offload: false
    video_cfg:
      save_video: false
    init_params:
      id: RealAgainstPegSlot-v0
      num_envs: null
      obs_mode: rgb
      control_mode: null
      sim_backend: gpu
      sim_config:
        sim_freq: 200
        control_freq: 20
      max_episode_steps: ${..max_episode_steps}
      sensor_configs:
        width: 224
        height: 224
        shader_pack: default
      render_mode: all

rollout:
  group_name: RolloutGroup
  backend: huggingface
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_prev_infos: false
  model:
    model_path: /mnt/public/chenyinuo/RealAgainst_new/RLinf/logs/20260819-11:34:51-realagainst_peg_slot_sft_openpi_pi05/realagainst_peg_slot_pi05_sft/checkpoints/global_step_10000
    precision: bf16

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 16
  global_batch_size: 32
  seed: 0
  enable_offload: false
  model:
    model_type: openpi_rlinf
    model_path: /mnt/public/chenyinuo/RealAgainst_new/RLinf/logs/20260819-11:34:51-realagainst_peg_slot_sft_openpi_pi05/realagainst_peg_slot_pi05_sft/checkpoints/global_step_10000
    precision: fp32
    pi05: true
    is_lora: false
    num_action_chunks: 10
    action_dim: 9
    policy_setup: panda-ee-dpose
    num_steps: 5
    openpi_data:
      repo_id: local/realagainst_peg_slot
      default_prompt: insert the grasped peg downward into the movable slot
      norm_stats_path: /mnt/public/chenyinuo/RealAgainst_new/RLinf/assets/pi05_realagainst_peg_slot/data/realagainst_peg_slot_expert/norm_stats.json
    openpi:
      task: sft
      online_lerobot: true
      config_name: pi05_realagainst_peg_slot
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: true
      use_rlt: false
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 10000
    lr_warmup_steps: 200
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: true
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false

critic:
  use_critic_model: false
