defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# All four GPUs collect 256 envs each; GPU 0 also hosts the SAC learner.
cluster:
  num_nodes: 1
  component_placement:
    actor: 0
    rollout: 0-3
    env: 0-3

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:REPO_PATH}/logs/realagainst_peg_slot_adversary_sac_rigid_peg
    project_name: rlinf
    experiment_name: adversary_sac_rigid_peg
    logger_backends: [tensorboard, swanlab]
    swanlab_mode: cloud
  max_epochs: 50000
  max_steps: 50000
  only_eval: false
  val_check_interval: 500
  save_interval: 500
  weight_sync_interval: 50
  resume_dir: null
  ckpt_path: null

# One change per evaluation; the interval is runner.val_check_interval.
budget:
  initial: 1.0
  minimum: 0.05
  maximum: 4.0
  success_low: 0.45
  success_high: 0.55
  # Outside the deadband: multiplier = clip(1 + gain * (success - 0.5), 0.8, 1.2).
  adjustment_gain: 0.5
  decrease_factor: 0.8
  increase_factor: 1.2

algorithm:
  # SAC updates per collection; runner intervals count actual optimizer updates.
  update_epoch: 50
  group_size: 1
  agg_q: min
  actor_agg_q: min
  adv_type: embodied_sac
  loss_type: embodied_sac
  loss_agg_func: token-mean
  bootstrap_type: standard
  # Per single control step, unlike the previous 10-step macro-action.
  gamma: 0.999
  tau: 0.005
  backup_entropy: true
  entropy_tuning:
    alpha_type: softplus
    initial_alpha: 0.001
    target_entropy: -3
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0
  replay_buffer:
    enable_cache: true
    # Counts batched rollout fragments, not individual transitions.
    # 256 * 256 envs * 20 steps = 1,310,720 transitions, as in the prior run.
    cache_size: 256
    sample_window_size: 256
    min_buffer_size: 4
    prefetch_size: 2
    auto_save: false
  target_update_freq: 1

env:
  group_name: EnvGroup
  train:
    env_type: maniskill
    total_num_envs: 1024
    rollout_epoch: 1
    reset_seed_mode: sequential
    wrap_obs_mode: raw
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: false
    reward_mode: raw
    seed: 1
    group_size: 1
    use_fixed_reset_state_ids: false
    expert_intervention_beta: null
    max_episode_steps: 100
    # Collect enough fresh transitions between the 50 SAC updates.
    max_steps_per_rollout_epoch: 20
    enable_offload: false
    video_cfg:
      save_video: false
    init_params: &task_params
      # Peg geometry is rigidly mounted on panda_hand; slot moves independently.
      id: RealAgainstPegSlot-v0
      num_envs: null
      obs_mode: rgb
      reward_mode: dense
      control_mode: pd_ee_delta_pose
      sim_backend: gpu
      adversary_control: true
      # Per control step: 2 mm per XY axis (2.83 mm diagonally), 1 degree yaw.
      adversary_slot_action_scale: 0.002
      adversary_slot_yaw_action_scale: 0.017453292519943295
      adversary_slot_xy_radius: 0.05
      adversary_slot_yaw_limit: 0.5235987755982988
      adversary_episode_steps: 100
      adversary_reward_mode: dense
      # Unsolved steps sum to 0.5; the last step pays 2x the first, plus 0.5 at timeout.
      adversary_survival_reward_total: 0.5
      adversary_survival_reward_ratio: 2.0
      adversary_timeout_bonus: 0.5
      sac_train_role: ${rollout.peg_slot_adversary.train_role}
      adversary_budget: ${budget.initial}
      # B=1 permits total 5 cm translation OR 30 deg yaw, or a mixture.
      adversary_budget_xy_reference: 0.05
      adversary_budget_yaw_reference: 0.5235987755982988
      sim_config:
        sim_freq: 200
        control_freq: 20
      max_episode_steps: 100
      sensor_configs:
        width: 224
        height: 224
        shader_pack: default
      render_mode: all
  eval:
    env_type: maniskill
    total_num_envs: 96
    # Four workers: 24 envs each * 3 rounds = 288 episodes; record this grouping.
    rollout_epoch: 3
    reset_seed_mode: sequential
    wrap_obs_mode: raw
    auto_reset: false
    ignore_terminations: false
    use_rel_reward: false
    reward_mode: raw
    seed: 20000
    group_size: 1
    use_fixed_reset_state_ids: false
    expert_intervention_beta: null
    max_episode_steps: 100
    max_steps_per_rollout_epoch: 100
    enable_offload: false
    video_cfg:
      save_video: true
      image_keys: [main_images, wrist_images]
      separate_envs: true
      stop_on_termination: true
      outcome_info_key: success
      video_base_dir: ${runner.logger.log_path}/videos
    init_params:
      <<: *task_params

rollout:
  group_name: RolloutGroup
  backend: huggingface
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  collect_transitions: true
  collect_prev_infos: false
  transition_obs_keys: [adversary_states]
  enable_torch_compile: false
  enable_cuda_graph: false
  peg_slot_adversary:
    enabled: true
    train_role: adversary
    # Standard SAC sampling for all training envs. Optional mixture is documented
    # in examples/embodiment/README_peg_slot_sac.md; evaluation stays deterministic.
    deterministic_train_fraction: 0.0
  model: ${actor.model}
  robot_model:
    model_type: resnet_mlp_policy
    model_path: ${oc.env:REPO_PATH}/logs/20260907-22:10:23-realagainst_peg_slot_sft_5000_resnet18_mlp_unfrozen/realagainst_peg_slot_resnet18_mlp_sft_5000_100k_freeze_resnet_False/checkpoints/global_step_100000
    precision: "32"
    is_lora: false
    policy_setup: panda-ee-dpose
    num_action_chunks: 1
    action_dim: 9
    predicted_action_dim: 6
    state_dim: 9
    image_size: 224
    hidden_dims: [256, 256, 256, 256]
    freeze_resnet: false
    pretrained_backbone: false
    norm_stats_path: ${oc.env:REPO_PATH}/data/realagainst_peg_slot_expert_5000/norm_stats.json
    add_value_head: false
    add_q_head: true
    sac_initial_log_std: -3.5
    critic_observation_key: critic_states
    critic_obs_dim: 37
    critic_hidden_dims: [256, 256]

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2048
  global_batch_size: 2048
  seed: 1
  enable_offload: false
  critic_warmup_updates: 100
  model:
    model_type: mlp_policy
    model_path: ""
    precision: "32"
    is_lora: false
    policy_setup: panda-ee-dpose
    num_action_chunks: 1
    action_dim: 3
    observation_key: adversary_states
    # Existing 17 privileged features + total budget + remaining budget.
    obs_dim: 19
    hidden_dims: [128, 128]
    # Initial Gaussian std before tanh, learned normally after critic warmup.
    sac_initial_std: 0.1
    value_granularity: chunk_level
    add_value_head: false
    add_q_head: true
  optim:
    clip_grad: 1.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  critic_optim:
    clip_grad: 10.0
    lr: 3.0e-4
    lr_scheduler: torch_constant
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    # Both policies are fully trainable. Keep the existing SAC flat-parameter
    # path; torch 2.11 FSDP1 original-parameter views break after SAC's no-grad pass.
    use_orig_params: false
    mixed_precision:
      param_dtype: "32"
      reduce_dtype: "32"
      buffer_dtype: "32"

reward:
  use_reward_model: false
critic:
  use_critic_model: false
