defaults:
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

actor:
  model:
    model_type: resnet_mlp_policy
    model_path: null
    precision: fp32
    is_lora: false
    add_value_head: false
    policy_setup: panda-ee-dpose
    state_dim: 9
    action_dim: 9
    predicted_action_dim: 6
    num_action_chunks: 1
    image_size: 224
    hidden_dims:
    - 256
    - 256
    - 256
    - 256
    pretrained_backbone: true
    pretrained_resnet_path: ${oc.env:REPO_PATH}/models/torch_cache/hub/checkpoints/resnet18-f37072fd.pth
    freeze_resnet: true
    norm_stats_path: ${oc.env:REPO_PATH}/data/realagainst_peg_slot_expert_5000/norm_stats.json
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    cpu_offload: false
    offload_pin_memory: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    mixed_precision:
      param_dtype: null
      reduce_dtype: null
      buffer_dtype: null
    amp_autocast:
      enabled: true
      precision: bf16
    grad_scaler:
      enabled: false
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 32
  global_batch_size: 64
  eval_batch_size: 1
  seed: 0
  enable_offload: false
  optim:
    lr: 1.0e-04
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    weight_decay: 0.0001
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 0
    lr_scheduler: constant
cluster:
  num_nodes: 1
  component_placement:
    actor: 2-3
runner:
  task_type: sft
  logger:
    log_path: ${oc.env:REPO_PATH}/logs/${runner.logger.experiment_name}
    project_name: rlinf
    experiment_name: realagainst_peg_slot_resnet18_mlp_sft_5000_100k_freeze_resnet_${actor.model.freeze_resnet}
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 100000
  val_check_interval: -1
  save_interval: 5000
  resume_dir: null
data:
  train_data_paths: ${oc.env:REPO_PATH}/data/realagainst_peg_slot_expert_5000
  num_workers: 32
  prefetch_factor: 2
algorithm:
  adv_type: gae
reward:
  use_reward_model: false
critic:
  use_critic_model: false
